<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stay Sticky</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="ss-header">
    <span class="ss-logo">📌 Stay Sticky</span>
  </header>

  <div class="ss-current-page">
    <button id="ssAddNoteBtn" class="ss-primary-btn">+ Add sticky note to this page</button>
    <p id="ssAddNoteError" class="ss-error" hidden></p>
  </div>

  <div class="ss-bank">
    <div class="ss-bank-header">
      <span>Sticky Note Bank</span>
      <span id="ssNoteCount" class="ss-count"></span>
    </div>
    <div id="ssBankList" class="ss-bank-list"></div>
    <p id="ssEmptyState" class="ss-empty" hidden>No sticky notes yet. Add one to a page to get started.</p>
  </div>

  <script src="../shared/utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
